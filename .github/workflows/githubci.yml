name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: true
        # The Makefile derives the version number from `git describe --tags`
        fetch-depth: 0

    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-none-eabi

    - name: Build PineTime bootloader
      # Same invocation that wasp-os uses to build the bootloader
      run: make -j$(nproc) BOARD=pinetime_nrf52832 all genhex

    - name: Upload bootloader
      uses: actions/upload-artifact@v7
      with:
        name: pinetime-bootloader
        path: _build-pinetime_nrf52832/*-nosd.hex
